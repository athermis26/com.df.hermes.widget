name: Build macOS

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Package .app into .zip
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -n1)
          echo "Found app: $APP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "hermes_widget-macos.zip"

      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -n1)
          hdiutil create -volname "Hermes Widget" \
            -srcfolder "$APP_NAME" \
            -ov -format UDZO \
            "hermes_widget-macos.dmg"

      - name: Upload .app zip
        uses: actions/upload-artifact@v4
        with:
          name: hermes_widget-macos-app
          path: build/macos/Build/Products/Release/hermes_widget-macos.zip
          if-no-files-found: error

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: hermes_widget-macos-dmg
          path: build/macos/Build/Products/Release/hermes_widget-macos.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/Build/Products/Release/hermes_widget-macos.zip
            build/macos/Build/Products/Release/hermes_widget-macos.dmg
